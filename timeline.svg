<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 356" width="860" height="356" role="img" aria-label="Experience and education timeline">
<style>
.h{font:600 13px 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#818cf8}
.w{font:600 12px 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7d8590}
.t{font:700 15px 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e6edf3}
.o{font:12px 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9da7b3}
.line{stroke-dasharray:400;animation:draw 1.4s .2s ease-out both}
.item{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.line,.item{animation:none}}
</style>
