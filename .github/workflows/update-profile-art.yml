name: Update profile art

on:
  schedule:
    - cron: "17 0 * * *" # 06:17 in Dhaka
  workflow_dispatch:

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stats, skyline, project cards and stack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_art.py
          python3 scripts/build_sections.py
      - name: Commit if changed
        run: |
          git config user.name "maremon7415"
          git config user.email "177396973+maremon7415@users.noreply.github.com" # counts on the contribution graph
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile art [skip ci]"
          git push
