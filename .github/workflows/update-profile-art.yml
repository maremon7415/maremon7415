name: Update profile art

on:
  schedule:
    - cron: "17 0 * * *" # 06:17 in Dhaka
  workflow_dispatch:

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build heatmap and info card
        run: python3 scripts/build_art.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg info-card.svg data/contributions.json
          git diff --cached --quiet || git commit -m "chore: refresh profile art [skip ci]"
          git push
