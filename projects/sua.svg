<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425 210" width="425" height="210" role="img" aria-label="San Uni Academy: Full LMS + merch store: marketplace, learning room, teacher studio, admin, ledger, protected video, live classes.">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8" stop-opacity=".16"/><stop offset=".55" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs>
<style>
.t{font:700 19px 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e6edf3}
.k{font:600 11px 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#818cf8;letter-spacing:.06em;text-transform:uppercase}
.d{font:13px 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9da7b3}
.c{font:600 11px 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e6edf3}
.card{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:pop .45s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
.edge{stroke-dasharray:1270;animation:draw 1.6s .2s ease-out both}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1270}to{stroke-dashoffset:0}}
@keyframes pulse{50%{opacity:.35;transform:scale(1.8)}}
@media (prefers-reduced-motion:reduce){.card,.chip,.edge,.pulse{animation:none}}
</style>
<g class="card">
<rect x=".5" y=".5" width="424" height="209" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect x=".5" y=".5" width="424" height="209" rx="14" fill="url(#g)"/>
<rect class="edge" x=".5" y=".5" width="424" height="209" rx="14" fill="none" stroke="#818cf8" stroke-opacity=".7"/>
<text x="24" y="34" class="k">production · client</text><circle class="pulse" cx="401" cy="30" r="4" fill="#39d353"/><text x="391" y="34" class="k" text-anchor="end">live</text>
<text x="24" y="66" class="t">San Uni Academy</text>
<text x="24" y="92" class="d">Full LMS + merch store: marketplace, learning</text><text x="24" y="112" class="d">room, teacher studio, admin, ledger, protected</text><text x="24" y="132" class="d">video, live classes.</text>
<g class="chip" style="animation-delay:500ms"><rect x="24" y="158" width="70" height="24" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".5"/><text x="59" y="174" class="c" text-anchor="middle">Next.js</text></g><g class="chip" style="animation-delay:620ms"><rect x="101.80000000000001" y="158" width="70" height="24" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".5"/><text x="137" y="174" class="c" text-anchor="middle">Express</text></g><g class="chip" style="animation-delay:740ms"><rect x="179.60000000000002" y="158" width="92" height="24" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".5"/><text x="226" y="174" class="c" text-anchor="middle">PostgreSQL</text></g><g class="chip" style="animation-delay:860ms"><rect x="279.6" y="158" width="55" height="24" rx="12" fill="#818cf8" fill-opacity=".12" stroke="#818cf8" stroke-opacity=".5"/><text x="307" y="174" class="c" text-anchor="middle">Redis</text></g>
</g>
</svg>
