<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="Languages by share of code, and the tools I use">
<style>text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace}.h{font-size:10px;fill:#7d8590;text-transform:uppercase;letter-spacing:.08em}.n{font-size:12px;fill:#e6edf3}.v{font-size:11px;fill:#7d8590}.c{font-size:11px;fill:#c9d1d9}
.bar{animation:grow 1s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:0 50%}
.chip{animation:pop .45s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
