<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 288" width="860" height="288" role="img" aria-label="Experience and education">
<style>text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace}.w{font-size:11px;font-weight:600;fill:#7d8590}.t{font-size:14px;font-weight:700;fill:#e6edf3}.o{font-size:11px;fill:#9da7b3}
.ln{stroke-dasharray:1;animation:draw 1.2s .1s ease-out both}
.it{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.7);opacity:.2}}
@media (prefers-reduced-motion:reduce){.ln,.it,.pulse{animation:none}}</style>
<rect x=".5" y=".5" width="859" height="287" rx="10" fill="#0d1117" stroke="#30363d"/>
<line class="ln" x1="150" y1="40" x2="150" y2="232" stroke="#30363d" stroke-width="2" pathLength="1"/><g class="it" style="animation-delay:300ms"><circle class="pulse" cx="150" cy="40" r="9" fill="#39d353" fill-opacity=".25"/><circle cx="150" cy="40" r="5" fill="#39d353" stroke="#39d353" stroke-width="2"/><text x="128" y="44" class="w" text-anchor="end">2024 – now</text><text x="176" y="41" class="t">Front-End Web Developer</text><text x="176" y="61" class="o"><tspan fill="#39d353">Lilium Info Tech</tspan> · production Next.js platforms, GSAP motion, UI architecture</text></g><g class="it" style="animation-delay:520ms"><circle cx="150" cy="104" r="5" fill="#0d1117" stroke="#39d353" stroke-width="2"/><text x="128" y="108" class="w" text-anchor="end">2023 – 2024</text><text x="176" y="105" class="t">Full-Stack Developer Intern</text><text x="176" y="125" class="o"><tspan fill="#39d353">IBCS PRIMEx</tspan> · full-stack modules in Laravel, PHP and JavaScript</text></g><g class="it" style="animation-delay:740ms"><circle cx="150" cy="168" r="5" fill="#0d1117" stroke="#39d353" stroke-width="2"/><text x="128" y="172" class="w" text-anchor="end">2024 – 2028</text><text x="176" y="169" class="t">B.Sc. Computer Science &amp; Technology</text><text x="176" y="189" class="o"><tspan fill="#39d353">Bangladesh University</tspan> · in progress</text></g><g class="it" style="animation-delay:960ms"><circle cx="150" cy="232" r="5" fill="#0d1117" stroke="#39d353" stroke-width="2"/><text x="128" y="236" class="w" text-anchor="end">2020 – 2024</text><text x="176" y="233" class="t">Diploma in Computer Science &amp; Engineering</text><text x="176" y="253" class="o"><tspan fill="#39d353">Habiganj Polytechnic Institute</tspan> · completed</text></g>
</svg>
